<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City's Gold Rush · Project Detail</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-line: #1f2530;
    --text: #e4e7ec;
    --text-dim: #7c8494;
    --accent: #ff9d4d;
    --data: #5eead4;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
    --heading: var(--mono), 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans', sans-serif;
    --sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.7;
  }

  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #0b0e14; }

  header {
    position: sticky;
    top: 0; z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 5vw;
    background: rgba(11,14,20,0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--panel-line);
  }

  .back-link {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color .2s;
  }
  .back-link:hover { color: var(--accent); }

  .lang-switch { display: flex; gap: 4px; font-family: var(--mono); font-size: 12px; }
  .lang-switch button {
    background: transparent;
    border: 1px solid var(--panel-line);
    color: var(--text-dim);
    width: 68px;
    padding: 6px 0;
    border-radius: 3px;
    cursor: pointer;
    transition: all .2s;
    text-align: center;
  }
  .lang-switch button:hover { color: var(--text); border-color: var(--text-dim); }
  .lang-switch button.active { color: var(--accent); border-color: var(--accent); }

  main { max-width: 960px; margin: 0 auto; padding: 60px 5vw 120px; }

  .build-tag {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 18px;
  }
  .build-tag small { color: var(--text-dim); margin-left: 10px; }

  h1 {
    font-family: var(--mono);
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.2;
    margin-bottom: 18px;
  }

  .lede {
    color: var(--text-dim);
    font-size: 17px;
    max-width: 68ch;
    margin-bottom: 30px;
  }

  .stack { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 50px; }
  .stack span {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--data);
    border: 1px solid rgba(94,234,212,0.3);
    padding: 4px 10px;
    border-radius: 3px;
  }

  .gallery { margin-bottom: 20px; }

  .gallery-main {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gallery-main video,
  .gallery-main img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  .gallery-thumbs {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    overflow-x: auto;
    padding-bottom: 6px;
  }
  .gallery-thumbs::-webkit-scrollbar { height: 4px; }
  .gallery-thumbs::-webkit-scrollbar-thumb { background: var(--panel-line); border-radius: 2px; }

  .thumb-btn {
    flex: 0 0 auto;
    width: 108px;
    aspect-ratio: 16 / 9;
    border: 1px solid var(--panel-line);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    background: var(--panel);
    position: relative;
    padding: 0;
  }
  .thumb-btn img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .55; transition: opacity .2s; }
  .thumb-btn:hover img { opacity: .85; }
  .thumb-btn.active { border-color: var(--accent); }
  .thumb-btn.active img { opacity: 1; }
  .thumb-btn .play-icon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #fff;
    background: rgba(0,0,0,0.28);
  }

  .info-panel {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    padding: 32px 0;
    margin: 50px 0 56px;
    border-top: 1px solid var(--panel-line);
    border-bottom: 1px solid var(--panel-line);
  }
  .info-block .label {
    font-family: var(--heading);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .info-block .value { font-size: 14.5px; color: var(--text); }
  .info-block .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .info-block .tags span {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--data);
    border: 1px solid rgba(94,234,212,0.3);
    padding: 3px 8px;
    border-radius: 3px;
  }

  .section-heading {
    font-family: var(--heading);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    border-bottom: 1px solid var(--panel-line);
    padding-bottom: 14px;
    margin-bottom: 20px;
  }
  .tech-goal {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 20px;
    padding: 22px 0;
    border-bottom: 1px solid var(--panel-line);
  }
  .tech-goal .num {
    font-family: var(--mono);
    font-size: 20px;
    color: var(--accent);
  }
  .tech-goal h3 { font-size: 16px; margin-bottom: 8px; }
  .tech-goal p { color: var(--text-dim); font-size: 14px; white-space: pre-line; }

  #techGoals { margin-bottom: 0; }

  section.block { margin-bottom: 52px; }
  section.block p { color: var(--text); white-space: pre-line; }

  .links-row {
    display: flex;
    gap: 28px;
    font-family: var(--mono);
    font-size: 13px;
    margin-top: 52px;
    padding-top: 32px;
    border-top: 1px solid var(--panel-line);
  }
  .links-row a { color: var(--text-dim); border-bottom: 1px solid transparent; }
  .links-row a:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 640px) {
    .info-panel { grid-template-columns: 1fr; gap: 24px; }
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html" data-i18n="back">← 返回项目列表</a>
  <div class="lang-switch" role="group" aria-label="Language">
    <button data-lang="zh">中文</button>
    <button data-lang="en" class="active">EN</button>
    <button data-lang="ja">日本語</button>
  </div>
</header>

<main>
  <div class="build-tag">BUILD.07</div>
  <h1 data-i18n="title">都市淘金</h1>
  <p class="lede" data-i18n="lede"></p>

  <div class="stack"></div>

  <div class="gallery">
    <div class="gallery-main" id="galleryMain"></div>
    <div class="gallery-thumbs" id="galleryThumbs"></div>
  </div>

  <div class="info-panel">
    <div class="info-block">
      <div class="label" data-i18n="genreLabel">作品类型</div>
      <div class="value" data-i18n="genreValue"></div>
    </div>
    <div class="info-block">
      <div class="label" data-i18n="creatorLabel">制作者信息</div>
      <div class="value" data-i18n="creatorValue"></div>
    </div>
    <div class="info-block">
      <div class="label" data-i18n="tagsLabel">游戏标签</div>
      <div class="tags" id="tagsList"></div>
    </div>
  </div>

  <section class="block">
    <h2 class="section-heading" data-i18n="h1">概述</h2>
    <p data-i18n="p1"></p>
  </section>

  <section class="block">
    <h2 class="section-heading" data-i18n="techGoalsHeading">技术目标</h2>
    <div id="techGoals"></div>
  </section>

  <section class="block">
    <h2 class="section-heading" data-i18n="h4">成果</h2>
    <p data-i18n="p4"></p>
  </section>
</main>

<script>
/** 媒体素材：第一项是视频，之后是截图 */
const mediaItems = [
  { type: 'video', src: 'asset/city_v.mp4', poster: 'asset/city_p_0.png' },
  { type: 'image', src: 'asset/city_p_1.png' },
  { type: 'image', src: 'asset/city_p_2.png' },
  { type: 'image', src: 'asset/city_p_3.png' },
  { type: 'image', src: 'asset/city_p_4.png' }
];

const translations = {
  zh: {
    pageTitle: "都市淘金 · 项目详情",
    back: "← 返回项目列表",
    title: "都市淘金",
    lede: "",
    genreLabel: "作品类型",
    genreValue: "",
    creatorLabel: "制作者信息",
    creatorValue: "",
    tagsLabel: "游戏标签",
    tags: [],
    h1: "概述",
    p1: "",
    techGoalsHeading: "技术目标",
    techGoals: [],
    h4: "成果",
    p4: ""
  },
  en: {
    pageTitle: "City's Gold Rush · Project Detail",
    back: "← Back to projects",
    title: "City's Gold Rush",
    lede: "",
    genreLabel: "Genre",
    genreValue: "",
    creatorLabel: "Creator",
    creatorValue: "",
    tagsLabel: "Tags",
    tags: [],
    h1: "Overview",
    p1: "",
    techGoalsHeading: "Technical Goals",
    techGoals: [],
    h4: "Outcome",
    p4: ""
  },
  ja: {
    pageTitle: "町のゴールドラッシュ・プロジェクト詳細",
    back: "← プロジェクト一覧に戻る",
    title: "町のゴールドラッシュ",
    lede: "",
    genreLabel: "作品の種類",
    genreValue: "",
    creatorLabel: "制作者情報",
    creatorValue: "",
    tagsLabel: "ゲームタグ",
    tags: [],
    h1: "概要",
    p1: "",
    techGoalsHeading: "技術目標",
    techGoals: [],
    h4: "成果",
    p4: ""
  }
};

let currentLang = localStorage.getItem('site-lang') || 'en';
let activeMediaIndex = 0;

/**
 * 在主展示区切换到指定媒体。
 * @param {number} index 媒体列表下标
 */
function showMediaItem(index) {
  activeMediaIndex = index;
  const item = mediaItems[index];
  const main = document.getElementById('galleryMain');
  main.innerHTML = item.type === 'video'
    ? `<video controls poster="${item.poster}" src="${item.src}"></video>`
    : `<img src="${item.src}" alt="">`;
  document.querySelectorAll('.thumb-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
}

/** 根据 mediaItems 生成缩略图条并显示当前项。 */
function renderGallery() {
  const thumbs = document.getElementById('galleryThumbs');
  thumbs.innerHTML = '';
  mediaItems.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'thumb-btn' + (i === activeMediaIndex ? ' active' : '');
    const thumbSrc = item.type === 'video' ? item.poster : item.src;
    btn.innerHTML = `<img src="${thumbSrc}" alt="">` + (item.type === 'video' ? '<span class="play-icon">▶</span>' : '');
    btn.addEventListener('click', () => showMediaItem(i));
    thumbs.appendChild(btn);
  });
  showMediaItem(activeMediaIndex);
}

/**
 * @param {string[]} tags
 */
function renderTags(tags) {
  document.getElementById('tagsList').innerHTML = tags.map(tag => `<span>${tag}</span>`).join('');
}

/**
 * @param {{title: string, desc: string}[]} goals
 */
function renderTechGoals(goals) {
  const wrap = document.getElementById('techGoals');
  wrap.innerHTML = goals.map((g, i) => `
    <div class="tech-goal">
      <div class="num">${String(i + 1).padStart(2, '0')}</div>
      <div>
        <h3>${g.title}</h3>
        <p>${g.desc}</p>
      </div>
    </div>
  `).join('');
}

/** 按当前语言刷新文案、标签与技术目标。空字符串也会写入，避免占位底稿残留。 */
function render() {
  const t = translations[currentLang];
  document.title = t.pageTitle;
  document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : currentLang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (Object.prototype.hasOwnProperty.call(t, key)) el.textContent = t[key];
  });

  document.querySelectorAll('.lang-switch button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });

  renderTags(t.tags);
  renderTechGoals(t.techGoals);
}

document.querySelectorAll('.lang-switch button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    localStorage.setItem('site-lang', currentLang);
    render();
  });
});

renderGallery();
render();
</script>

</body>
</html>
