<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="asset/favicon.svg" type="image/svg+xml">
<title>项目详情</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-line: #1f2530;
    --text: #e4e7ec;
    --text-dim: #7c8494;
    --accent: #ff9d4d;
    --data: #5eead4;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
    --heading: var(--mono), 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans', sans-serif;
    --sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 18px;
    line-height: 1.7;
  }

  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #0b0e14; }

  header {
    position: sticky;
    top: 0; z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 5vw;
    background: rgba(11,14,20,0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--panel-line);
  }

  .back-link {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color .2s;
  }
  .back-link:hover { color: var(--accent); }

  .lang-switch { display: flex; gap: 4px; font-family: var(--mono); font-size: 14px; }
  .lang-switch button {
    background: transparent;
    border: 1px solid var(--panel-line);
    color: var(--text-dim);
    width: 80px;
    padding: 6px 0;
    border-radius: 3px;
    cursor: pointer;
    transition: all .2s;
    text-align: center;
  }
  .lang-switch button:hover { color: var(--text); border-color: var(--text-dim); }
  .lang-switch button.active { color: var(--accent); border-color: var(--accent); }

  main { max-width: 960px; margin: 0 auto; padding: 60px 5vw 120px; }

  .build-tag {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 18px;
  }
  .build-tag small { color: var(--text-dim); margin-left: 10px; }

  h1 {
    font-family: var(--mono);
    font-size: clamp(32px, 5vw, 48px);
    line-height: 1.2;
    margin-bottom: 18px;
  }

  .lede {
    color: var(--text-dim);
    font-size: 19px;
    max-width: 68ch;
    margin-bottom: 30px;
  }

  .stack { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 50px; }
  .stack span {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--data);
    border: 1px solid rgba(94,234,212,0.3);
    padding: 4px 10px;
    border-radius: 3px;
  }

  /* ---------- Gallery (Steam 式媒体展示) ---------- */
  .gallery { margin-bottom: 12px; }

  .gallery-main {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gallery-main video,
  .gallery-main img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  .gallery-thumbs {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    overflow-x: auto;
    padding-bottom: 6px;
  }
  .gallery-thumbs::-webkit-scrollbar { height: 4px; }
  .gallery-thumbs::-webkit-scrollbar-thumb { background: var(--panel-line); border-radius: 2px; }

  .thumb-btn {
    flex: 0 0 auto;
    width: 108px;
    aspect-ratio: 16 / 9;
    border: 1px solid var(--panel-line);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    background: var(--panel);
    position: relative;
    padding: 0;
  }
  .thumb-btn img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .55; transition: opacity .2s; }
  .thumb-btn:hover img { opacity: .85; }
  .thumb-btn.active { border-color: var(--accent); }
  .thumb-btn.active img { opacity: 1; }
  .thumb-btn .play-icon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff;
    background: rgba(0,0,0,0.28);
  }

  /* ---------- Info panel: 类型 / 制作者 / 标签 ---------- */
  .info-panel {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    padding: 32px 0;
    margin: 32px 0 56px;
    border-top: 1px solid var(--panel-line);
    border-bottom: 1px solid var(--panel-line);
  }
  .info-block .label {
    font-family: var(--heading);
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .info-block .value {
    font-family: var(--sans);
    font-size: 16.5px;
    color: var(--text);
    line-height: 1.7;
  }
  .info-block .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .info-block .tags span {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--data);
    border: 1px solid rgba(94,234,212,0.3);
    padding: 3px 8px;
    border-radius: 3px;
  }

  /* ---------- 技术目标（编号） ---------- */
  .section-heading {
    font-family: var(--heading);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    border-bottom: 1px solid var(--panel-line);
    padding-bottom: 14px;
    margin-bottom: 20px;
  }
  .tech-goal {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 20px;
    padding: 22px 0;
    border-bottom: 1px solid var(--panel-line);
  }
  .tech-goal .num {
    font-family: var(--mono);
    font-size: 22px;
    color: var(--accent);
  }
  .tech-goal h3 { font-size: 18px; margin-bottom: 8px; }
  .tech-goal p { color: var(--text-dim); font-size: 16px; white-space: pre-line; }

  #techGoals { margin-bottom: 0; }

  section.block { margin-bottom: 52px; }
  section.block p { color: var(--text); font-size: 18px; white-space: pre-line; }

  .links-row {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    margin: 16px 0 8px;
  }
  .links-row a {
    color: var(--text);
    font-weight: 700;
    border-bottom: 1px solid transparent;
  }
  .links-row a:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 640px) {
    .info-panel { grid-template-columns: 1fr; gap: 24px; }
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html" data-i18n="back">← 返回项目列表</a>
  <div class="lang-switch" role="group" aria-label="Language">
    <button data-lang="zh">中文</button>
    <button data-lang="en">EN</button>
    <button data-lang="ja" class="active">日本語</button>
  </div>
</header>

<main>
  <div class="build-tag">BUILD.01<small>DirectX 11</small></div>
  <h1 data-i18n="title">炼 · 核（制作中）</h1>
  <p class="lede" data-i18n="lede">类幸存者玩法搭配可视化编程。</p>

  <div class="stack">
    <span>C++</span><span>DirectX 11</span><span>HLSL</span>
  </div>

  <div class="gallery">
    <div class="gallery-main" id="galleryMain"></div>
    <div class="gallery-thumbs" id="galleryThumbs"></div>
  </div>

  <div class="links-row">
    <a href="https://github.com/MrMedius/CoreRefiner" target="_blank" rel="noopener" data-i18n="codeLink">查看代码仓库 →</a>
  </div>

  <div class="info-panel">
    <div class="info-block">
      <div class="label" data-i18n="genreLabel">作品类型</div>
      <div class="value" data-i18n="genreValue">游戏类 · 技术向 · 策划向</div>
    </div>
    <div class="info-block">
      <div class="label" data-i18n="creatorLabel">制作者信息</div>
      <div class="value" data-i18n="creatorValue">个人开发</div>
    </div>
    <div class="info-block">
      <div class="label" data-i18n="tagsLabel">游戏标签</div>
      <div class="tags" id="tagsList"></div>
    </div>
  </div>

  <section class="block">
    <h2 class="section-heading" data-i18n="h1">概述</h2>
    <p data-i18n="p1">选用自制引擎开发。
打算不用美术素材，尽可能用几何体和着色器完成整个游戏。</p>
  </section>

  <section class="block">
    <h2 class="section-heading" data-i18n="techGoalsHeading">技术目标</h2>
    <div id="techGoals"></div>
  </section>

  <section class="block">
    <h2 class="section-heading" data-i18n="h4">成果</h2>
    <p data-i18n="p4">目前依然在开发中</p>
  </section>

</main>

<script>
/** 媒体素材：第一项是视频，之后是截图 */
const mediaItems = [
  { type: 'video', src: 'asset/core_v.mp4', poster: 'asset/core_p_0.png' },
  { type: 'image', src: 'asset/core_p_1.png' }
];

const translations = {
  zh: {
    pageTitle: "炼 · 核（制作中） · 项目详情",
    back: "← 返回项目列表",
    title: "炼 · 核（制作中）",
    lede: "类幸存者玩法搭配可视化编程。",
    genreLabel: "作品类型",
    genreValue: "游戏类 · 技术向 · 策划向",
    creatorLabel: "制作者信息",
    creatorValue: "个人开发",
    tagsLabel: "游戏标签",
    tags: ["类幸存者", "空间管理", "资源管理", "解谜", "3D"],
    h1: "概述",
    p1: "选用自制引擎开发。\n打算不用美术素材，尽可能用几何体和着色器完成整个游戏。",
    techGoalsHeading: "技术目标",
    techGoals: [
      { title: "核心玩法：自定义攻击", desc: "参考现实编程的形式设计机制，玩家可以自定义各种各样的子弹，不同的机制之间会有交叉作用，让每一局游戏都有不一样的体验。" },
      { title: "辅助玩法：空间复杂度", desc: "在有限的空间内，玩家必须思考要如何塞进更多节点和如何利用现有的资源组装出想要的攻击。" },
      { title: "辅助玩法：时间复杂度", desc: "在有限的时间内，玩家必须思考如何更加高效的让自己目标的攻击被组装出来。" },
      { title: "辅助玩法：稳定性和鲁棒性", desc: "此外，玩家还必须考虑如何让自己的这套体系更加稳定的产出自己构思中的攻击，并在遇到意外情况时能保证自己的存活率。" }
    ],
    h4: "成果",
    p4: "目前依然在开发中",
    codeLink: "查看代码仓库 →"
  },
  en: {
    pageTitle: "Core Refiner（In production） · Project Detail",
    back: "← Back to projects",
    title: "Core\u00A0Refiner\u2060（In\u00A0production）",
    lede: "Survivor-style gameplay combined with visual programming.",
    genreLabel: "Genre",
    genreValue: "Game Project · Engineering-Focused · Design-Focused",
    creatorLabel: "Creator",
    creatorValue: "Solo Development",
    tagsLabel: "Tags",
    tags: ["Survivor-like", "Space Management", "Resource Management", "Puzzle", "3D"],
    h1: "Overview",
    p1: "Developed using a custom engine. \nThe plan is to forgo traditional art assets and build the entire game using only geometric primitives and shaders.",
    techGoalsHeading: "Technical Goals",
    techGoals: [
      { title: "Core Gameplay: Custom Attacks", desc: "The mechanic is designed in the form of real programming. Players can customize all kinds of bullets, and different mechanics interact, so every run feels different." },
      { title: "Supporting Gameplay: Space Complexity", desc: "Within a limited space, the player has to think about how to fit in more nodes and how to assemble the attack they want from the resources on hand." },
      { title: "Supporting Gameplay: Time Complexity", desc: "Within a limited time, the player has to think about how to assemble their target attack more efficiently." },
      { title: "Supporting Gameplay: Stability and Robustness", desc: "The player also has to consider how to make this system produce the attack they designed more stably, and how to keep their survival rate up when something unexpected happens." }
    ],
    h4: "Outcome",
    p4: "Still in development.",
    codeLink: "View repository →"
  },
  ja: {
    pageTitle: "煉 · 核（製作中）・プロジェクト詳細",
    back: "← プロジェクト一覧に戻る",
    title: "煉 · 核（製作中）",
    lede: "サバイバー系ゲームプレイとビジュアルプログラミングの融合。",
    genreLabel: "作品の種類",
    genreValue: "ゲーム制作 · 技術重視 · 企画重視",
    creatorLabel: "制作者情報",
    creatorValue: "個人開発",
    tagsLabel: "ゲームタグ",
    tags: ["サバイバー系", "空間管理", "リソース管理", "パズル", "3D"],
    h1: "概要",
    p1: "独自エンジンを使用して開発。\n従来のアートアセットは使用せず、幾何学プリミティブとシェーダーのみでゲーム全体を構築する方針。",
    techGoalsHeading: "技術目標",
    techGoals: [
      { title: "コアプレイ：カスタム攻撃", desc: "現実のプログラミングの形を参考にメカニズムを設計しました。プレイヤーはさまざまな弾をカスタマイズでき、異なるメカニズムが互いに作用するため、プレイごとに違う体験になります。" },
      { title: "補助プレイ：空間計算量", desc: "限られた空間の中で、より多くのノードをどう詰め込むか、手元のリソースでどう狙った攻撃を組み立てるかを考える必要があります。" },
      { title: "補助プレイ：時間計算量", desc: "限られた時間の中で、目標の攻撃をより効率よく組み立てる方法を考える必要があります。" },
      { title: "補助プレイ：安定性とロバスト性", desc: "さらに、構想どおりの攻撃をより安定して生み出す方法を考え、想定外の状況でも生存率を保てるようにする必要があります。" }
    ],
    h4: "成果",
    p4: "現在も開発中です。",
    codeLink: "リポジトリを見る →"
  }
};

let currentLang = localStorage.getItem('site-lang') || 'ja';
let activeMediaIndex = 0;

/**
 * 在主展示区切换到指定媒体。
 * @param {number} index 媒体列表下标
 */
function showMediaItem(index) {
  activeMediaIndex = index;
  const item = mediaItems[index];
  const main = document.getElementById('galleryMain');
  main.innerHTML = item.type === 'video'
    ? `<video controls poster="${item.poster}" src="${item.src}"></video>`
    : `<img src="${item.src}" alt="">`;
  document.querySelectorAll('.thumb-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
}

/** 根据 mediaItems 生成缩略图条并显示当前项。 */
function renderGallery() {
  const thumbs = document.getElementById('galleryThumbs');
  thumbs.innerHTML = '';
  mediaItems.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'thumb-btn' + (i === activeMediaIndex ? ' active' : '');
    const thumbSrc = item.type === 'video' ? item.poster : item.src;
    btn.innerHTML = `<img src="${thumbSrc}" alt="">` + (item.type === 'video' ? '<span class="play-icon">▶</span>' : '');
    btn.addEventListener('click', () => showMediaItem(i));
    thumbs.appendChild(btn);
  });
  showMediaItem(activeMediaIndex);
}

/**
 * @param {string[]} tags
 */
function renderTags(tags) {
  document.getElementById('tagsList').innerHTML = tags.map(tag => `<span>${tag}</span>`).join('');
}

/**
 * @param {{title: string, desc: string}[]} goals
 */
function renderTechGoals(goals) {
  const wrap = document.getElementById('techGoals');
  wrap.innerHTML = goals.map((g, i) => `
    <div class="tech-goal">
      <div class="num">${String(i + 1).padStart(2, '0')}</div>
      <div>
        <h3>${g.title}</h3>
        <p>${g.desc}</p>
      </div>
    </div>
  `).join('');
}

/** 按当前语言刷新文案、标签与技术目标。空字符串也会写入，避免占位底稿残留。 */
function render() {
  const t = translations[currentLang];
  document.title = t.pageTitle;
  document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : currentLang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (Object.prototype.hasOwnProperty.call(t, key)) el.textContent = t[key];
  });

  document.querySelectorAll('.lang-switch button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });

  renderTags(t.tags);
  renderTechGoals(t.techGoals);
}

document.querySelectorAll('.lang-switch button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    localStorage.setItem('site-lang', currentLang);
    render();
  });
});

renderGallery();
render();
</script>

</body>
</html>
