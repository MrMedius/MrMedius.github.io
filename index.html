<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="asset/favicon.svg" type="image/svg+xml">
<title>ポートフォリオ・プロジェクト</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-line: #1f2530;
    --text: #e4e7ec;
    --text-dim: #7c8494;
    --accent: #ff9d4d;
    --data: #5eead4;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
    --sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 18px;
    line-height: 1.6;
  }

  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #0b0e14; }

  header {
    position: sticky;
    top: 0; z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 5vw;
    background: rgba(11,14,20,0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--panel-line);
  }

  .logo {
    font-family: var(--mono);
    font-size: 16px;
    letter-spacing: 1px;
    color: var(--text-dim);
  }
  .lang-switch { display: flex; gap: 4px; font-family: var(--mono); font-size: 14px; }
  .lang-switch button {
    background: transparent;
    border: 1px solid var(--panel-line);
    color: var(--text-dim);
    width: 80px;
    padding: 6px 0;
    border-radius: 3px;
    cursor: pointer;
    transition: all .2s;
    text-align: center;
  }
  .lang-switch button:hover { color: var(--text); border-color: var(--text-dim); }
  .lang-switch button.active { color: var(--accent); border-color: var(--accent); }
  .lang-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { padding: 0 5vw 100px; max-width: 1240px; margin: 0 auto; }

  /* ---------- Intro ---------- */
  .intro {
    padding: 70px 0 60px;
    border-bottom: 1px solid var(--panel-line);
    margin-bottom: 60px;
  }
  .intro .eyebrow {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .intro .eyebrow::before { content: ''; width: 22px; height: 1px; background: var(--accent); }
  .intro h1 {
    font-family: var(--mono);
    font-size: clamp(34px, 5vw, 52px);
    letter-spacing: -0.5px;
    margin-bottom: 18px;
  }
  .intro .bio {
    color: var(--text-dim);
    font-size: 18px;
    max-width: 85ch;
    white-space: pre-line;
  }

  /* ---------- Tech stack ---------- */
  .tech-stack {
    margin-bottom: 60px;
    padding-bottom: 56px;
    border-bottom: 1px solid var(--panel-line);
  }
  .tech-stack .stack-heading {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .logo-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 22px;
  }
  .logo-group {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .logo-divider {
    width: 1px;
    height: 28px;
    background: var(--panel-line);
    flex: 0 0 auto;
  }
  .logo-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    color: var(--text-dim);
    transition: color .2s;
  }
  .logo-item:hover { color: var(--accent); }
  .logo-item svg { width: 100%; height: 100%; fill: currentColor; }
  .logo-item.text-mark {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .5px;
    border: 1px solid var(--panel-line);
    border-radius: 3px;
    width: auto;
    min-width: 28px;
    padding: 0 6px;
  }
  @media (max-width: 700px) {
    .logo-row { gap: 16px; }
    .logo-group { gap: 16px; }
  }

  /* ---------- Section head ---------- */
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--panel-line);
    padding-bottom: 20px;
    margin-bottom: 44px;
  }
  .section-head h2 {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 600;
  }
  .section-head .tag { font-family: var(--mono); font-size: 14px; color: var(--text-dim); }

  /* ---------- Project cards ---------- */
  .projects { display: flex; flex-direction: column; gap: 2px; }

  .project {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color .25s;
  }
  .project:hover { border-color: var(--accent); }

  .project-head {
    display: grid;
    grid-template-columns: 110px 1fr 260px;
    gap: 24px;
    align-items: center;
    padding: 24px 28px;
    cursor: pointer;
  }

  .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 1px dashed var(--panel-line);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    padding: 6px;
    overflow: hidden;
  }
  .thumb.has-image { border-style: solid; padding: 0; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .info { cursor: pointer; }
  .build-tag {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .build-tag small { color: var(--text-dim); margin-left: 8px; }

  .info h3 { font-size: 22px; margin-bottom: 8px; }
  .info p { color: var(--text-dim); font-size: 16px; max-width: 56ch; }

  .stack { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .stack span {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--data);
    border: 1px solid rgba(94,234,212,0.3);
    padding: 3px 8px;
    border-radius: 3px;
  }

  .side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    font-family: var(--mono);
    font-size: 14px;
    text-align: right;
    min-width: 260px;
    white-space: nowrap;
  }
  .side .detail-link {
    color: var(--accent);
    border-bottom: 1px solid transparent;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .side .detail-link:hover { border-color: var(--accent); }
  .side .disabled { color: #4a5160; }
  .side .toggle-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .side .toggle-btn:hover { color: var(--text); }
  .side .toggle-btn .expand-icon {
    display: inline-block;
    transform: rotate(0deg);
    transition: transform .3s;
  }
  .project.open .side .toggle-btn .expand-icon { transform: rotate(90deg); }

  .project-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
  }

  .project-body-inner {
    padding: 0 28px 28px;
    border-top: 1px solid var(--panel-line);
  }
  .project-body-inner .overview {
    padding-top: 20px;
    color: var(--text-dim);
    font-size: 16.5px;
    max-width: 90ch;
    white-space: pre-line;
  }

  footer {
    padding: 30px 5vw;
    border-top: 1px solid var(--panel-line);
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
  }
  .footer-links {
    display: flex;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  .footer-links a {
    color: var(--text-dim);
    border-bottom: 1px solid transparent;
    transition: color .2s, border-color .2s;
  }
  .footer-links a:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 700px) {
    .project-head { grid-template-columns: 64px 1fr; grid-template-areas: "thumb info" "side side"; }
    .thumb { grid-area: thumb; }
    .info { grid-area: info; }
    .side { grid-area: side; flex-direction: row; justify-content: space-between; align-items: center; margin-top: 14px; min-width: 0; }
  }
</style>
</head>

const pageTitles = { zh: "作品集 · 项目", en: "Portfolio · Projects", ja: "ポートフォリオ・プロジェクト" };

let currentLang = localStorage.getItem('site-lang') || 'ja';
/** 记录当前展开的项目 index，跨语言切换保持 */
let openSet = new Set();

/**
 * 生成一张项目卡片。
 * @param {object} p 当前语言下的项目数据
 * @param {number} i 项目下标
 * @param {object} t 当前语言文案
 * @returns {HTMLElement}
 */
function buildCard(p, i, t) {
  const card = document.createElement('div');
  card.className = 'project' + (openSet.has(i) ? ' open' : '');

  const stackHtml = p.stack.map(s => `<span>${s}</span>`).join('');
  const sideLink = p.hasDetail
    ? `<a class="detail-link" href="${p.detailHref}">${t.detail}</a>`
    : `<span class="disabled">${t.comingSoon}</span>`;
  const thumbClass = 'thumb' + (p.thumbSrc ? ' has-image' : '');
  const thumbContent = p.thumbSrc
    ? `<img src="${p.thumbSrc}" alt="${p.title}">`
    : t.thumbAlt;

  card.innerHTML = `
    <div class="project-head">
      <div class="${thumbClass}">${thumbContent}</div>
      <div class="info">
        <div class="build-tag">${p.tag}${p.sub ? `<small>${p.sub}</small>` : ''}</div>
        <h3>${p.title}</h3>
        <p>${p.desc}</p>
        <div class="stack">${stackHtml}</div>
      </div>
      <div class="side">
        ${sideLink}
        <button class="toggle-btn" type="button" aria-expanded="${openSet.has(i)}">
          <span data-toggle-label>${openSet.has(i) ? t.toggleClose : t.toggleOpen}</span>
          <span class="expand-icon">▸</span>
        </button>
      </div>
    </div>
    <div class="project-body">
      <div class="project-body-inner">
        <div class="overview">${p.overview}</div>
      </div>
    </div>
  `;

  const body = card.querySelector('.project-body');
  const toggleBtn = card.querySelector('.toggle-btn');
  const toggleLabel = card.querySelector('[data-toggle-label]');
  const projectHead = card.querySelector('.project-head');

  function setOpen(open) {
    if (open) {
      openSet.add(i);
      card.classList.add('open');
      body.style.maxHeight = body.scrollHeight + 'px';
      toggleLabel.textContent = t.toggleClose;
      toggleBtn.setAttribute('aria-expanded', 'true');
    } else {
      openSet.delete(i);
      body.style.maxHeight = body.scrollHeight + 'px'; // 先定住当前高度
      requestAnimationFrame(() => { body.style.maxHeight = '0px'; });
      card.classList.remove('open');
      toggleLabel.textContent = t.toggleOpen;
      toggleBtn.setAttribute('aria-expanded', 'false');
    }
  }

  function toggle() { setOpen(!card.classList.contains('open')); }

  /** 整个 project-head 都是热区；点在「完整项目页」链接上时放行跳转。 */
  projectHead.addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    toggle();
  });

  /** 语言切换后如果本来是展开状态，直接同步高度（无需动画）。 */
  if (openSet.has(i)) {
    requestAnimationFrame(() => { body.style.maxHeight = body.scrollHeight + 'px'; });
  }

  return card;
}

/** 按当前语言刷新整页文案并重建项目列表。 */
function render() {
  const t = translations[currentLang];
  document.title = pageTitles[currentLang];
  document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : currentLang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (Object.prototype.hasOwnProperty.call(t, key)) el.textContent = t[key];
  });

  document.querySelectorAll('.lang-switch button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });

  const list = document.getElementById('projectList');
  list.innerHTML = '';
  t.projects.forEach((p, i) => list.appendChild(buildCard(p, i, t)));
}

document.querySelectorAll('.lang-switch button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    localStorage.setItem('site-lang', currentLang);
    render();
  });
});

render();
</script>
